# 示例配置：各厂商 SDK 目录用各自环境变量指向（勿混用）。
# 周立功：ZLG_SDK_DIR（zlgcan.dll）。创芯：CHUANGXIN_SDK_DIR（ControlCAN.dll）。
# Vector：python-can vector，通道号与 XL 全局索引一致。

[server]
backend = "stdio"          # MCP 传输：stdio | http（http 只绑 127.0.0.1）
log_level = "INFO"

[[devices]]
name = "bus0"              # 逻辑别名，Agent 通过它引用设备
vendor = "zlg"
model = "USBCAN-2E-U"
channel = 1                # 物理通道 1（第 2 个通道）
nominal = 250000           # 标称波特率 250k

[[devices]]
name = "bus1"              # USBCAN-II 示例别名
vendor = "zlg"
model = "USBCAN-II"
channel = 0
nominal = 250000

[[devices]]
name = "vn_ch3"            # VN1640A 硬件 Channel 3 → python-can channel=2
vendor = "vector"
model = "VN1640A"
channel = 2
nominal = 250000

[[devices]]
name = "cx0"               # 创芯 USB_CAN-2C 通道 0（第一路）
vendor = "chuangxin"
model = "USB_CAN-2C"
channel = 0
nominal = 250000
