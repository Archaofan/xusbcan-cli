# xusbcan 示例配置
# 环境变量 ZLG_SDK_DIR 指向周立功 SDK 目录（含 zlgcan.dll 与 kerneldlls/）
# 当前真机：USBCAN-2E-U 使用第 2 个通道（channel=1），对端 ECU 波特率 250 kbit/s

[server]
backend = "stdio"          # MCP 传输：stdio | http（http 只绑 127.0.0.1）
log_level = "INFO"

[[devices]]
name = "ecu"               # 逻辑别名，Agent 通过它引用设备
vendor = "zlg"
model = "USBCAN-2E-U"
channel = 1                # 物理通道 1（第 2 个通道）
nominal = 250000           # ECU 波特率 250k
