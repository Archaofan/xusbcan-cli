[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xusbcan-cli"
version = "0.1.3"
description = "面向 AI Agent 的 CAN 总线调试工具（CLI + MCP）"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Archaofan" }]
keywords = [
    "can",
    "can-bus",
    "mcp",
    "model-context-protocol",
    "python-can",
    "ai-agent",
    "automotive",
    "embedded",
    "cli",
]
dependencies = [
    "python-can>=4.4",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/Archaofan/xusbcan-cli"
Repository = "https://github.com/Archaofan/xusbcan-cli"
Documentation = "https://deepwiki.com/Archaofan/xusbcan-cli"
Issues = "https://github.com/Archaofan/xusbcan-cli/issues"
Changelog = "https://github.com/Archaofan/xusbcan-cli/releases"

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
xusbcan = "xusbcan.cli.app:main"
xusbcan-mcp = "xusbcan.mcp.server:main"
# Same name as the PyPI package so `uvx xusbcan-cli` / MCP Registry can launch MCP.
xusbcan-cli = "xusbcan.mcp.server:main"

[project.entry-points."can.interface"]
zlg = "xusbcan.adapters.zlg.backend:ZlgBus"
chuangxin = "xusbcan.adapters.chuangxin.backend:ChuangxinBus"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

