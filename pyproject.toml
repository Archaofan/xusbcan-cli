[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xusbcan-cli"
version = "0.1.0"
description = "面向 AI Agent 的 CAN 总线调试工具（CLI + MCP）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-can>=4.4",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
xusbcan = "xusbcan.cli.app:main"
xusbcan-mcp = "xusbcan.mcp.server:main"

[project.entry-points."can.interface"]
zlg = "xusbcan.adapters.zlg.backend:ZlgBus"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
