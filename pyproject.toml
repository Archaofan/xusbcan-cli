[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xusbcan-cli"
version = "0.1.0"
description = "面向 AI Agent 的 CAN 总线调试工具（CLI + MCP）"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Archaofan" }]
dependencies = [
    "python-can>=4.4",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
xusbcan = "xusbcan.cli.app:main"
xusbcan-mcp = "xusbcan.mcp.server:main"

[project.entry-points."can.interface"]
zlg = "xusbcan.adapters.zlg.backend:ZlgBus"
chuangxin = "xusbcan.adapters.chuangxin.backend:ChuangxinBus"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

