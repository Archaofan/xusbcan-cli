name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: ruff check src tests
      # 验证 Linux 上 import xusbcan 不触发 zlg DLL 加载（延迟导入）
      - run: python -c "import xusbcan; print('Linux import ok（未加载 DLL）')"
